<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Кокошник</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Marker overlay ──────────────────────────────────────── */
    #markerOverlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #fafafa;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    #markerOverlay h2 {
      margin: 0;
      font-size: 20px;
      color: #222;
      text-align: center;
    }
    #markerOverlay .marker-img-wrap {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      padding: 20px;
    }
    #markerOverlay img {
      display: block;
      width: min(72vw, 72vh, 320px);
      height: auto;
    }
    #markerOverlay p {
      margin: 0;
      font-size: 14px;
      color: #555;
      text-align: center;
      max-width: 300px;
      line-height: 1.5;
    }
    #btnHideMarker {
      padding: 14px 36px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    #btnHideMarker:active { opacity: 0.8; }

    /* ── Hint bar ────────────────────────────────────────────── */
    #hint {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.60);
      color: #fff;
      padding: 10px 18px;
      border-radius: 22px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.3s;
    }

    /* ── Loading bar ─────────────────────────────────────────── */
    #loadingBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #d4af37, #ff8f00);
      z-index: 9998;
      animation: loadingAnim 1.6s ease-in-out infinite;
    }
    @keyframes loadingAnim {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    /* ── Show-marker button ──────────────────────────────────── */
    #showMarkerBtn {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 14px 28px;
      background: rgba(20,20,20,0.72);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #showMarkerBtn:active { transform: translateX(-50%) scale(0.95); }

    /* ── Control panel ───────────────────────────────────────── */
    #ui {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9999;
      padding: 16px 20px 32px;
      background: rgba(10,10,10,0.60);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid rgba(255,255,255,0.10);
      display: none;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .panel-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.45);
      align-self: flex-start;
    }

    /* Color swatches */
    .swatch-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .swatch {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.18);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .swatch:active { transform: scale(0.88); }
    .swatch.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
      transform: scale(1.12);
    }
    .swatch-none {
      background: conic-gradient(
        #bbb 0deg 90deg, #fff 90deg 180deg,
        #bbb 180deg 270deg, #fff 270deg 360deg
      );
    }

    /* Action buttons */
    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .action-btn {
      padding: 10px 18px;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 22px;
      background: rgba(255,255,255,0.10);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      backdrop-filter: blur(4px);
    }
    .action-btn:active { background: rgba(255,255,255,0.22); }
    .action-btn.active {
      background: rgba(255,255,255,0.20);
      border-color: rgba(255,255,255,0.60);
    }

    /* ── Zoom controls ───────────────────────────────────────── */
    .zoom-wrap {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .zoom-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      background: rgba(0,0,0,0.58);
      color: #fff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .zoom-btn:active { background: rgba(0,0,0,0.80); }
    .zoom-label {
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      background: rgba(0,0,0,0.50);
      padding: 3px 7px;
      border-radius: 8px;
    }

    /* ── Found flash ─────────────────────────────────────────── */
    @keyframes flashIn {
      0%   { opacity: 0; }
      40%  { opacity: 0.30; }
      100% { opacity: 0; }
    }
    .flash-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,220,0.6);
      pointer-events: none;
      z-index: 8000;
      animation: flashIn 0.5s ease-out forwards;
    }
  </style>
</head>
<body>

  <!-- Marker image overlay ─────────────────────────────────────────────── -->
  <div id="markerOverlay">
    <h2>Маркер для AR</h2>
    <div class="marker-img-wrap">
      <img src="https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Hiro marker">
    </div>
    <p>Покажите этот маркер другому устройству<br>
       и наведите на него камеру AR-страницы</p>
    <button id="btnHideMarker">← Вернуться к камере</button>
  </div>

  <!-- Loading bar ──────────────────────────────────────────────────────── -->
  <div id="loadingBar"></div>

  <!-- Zoom ────────────────────────────────────────────────────────────── -->
  <div class="zoom-wrap">
    <button class="zoom-btn" id="btnZoomIn">+</button>
    <span class="zoom-label" id="zoomLabel">1×</span>
    <button class="zoom-btn" id="btnZoomOut">−</button>
  </div>

  <!-- Hint ────────────────────────────────────────────────────────────── -->
  <div id="hint">Наведите камеру на маркер</div>

  <!-- Show-marker button (pre-detection state) ────────────────────────── -->
  <button id="showMarkerBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/><circle cx="17.5" cy="17.5" r="2.5"/>
    </svg>
    Показать маркер
  </button>

  <!-- Control panel (shown when marker detected) ───────────────────────── -->
  <div id="ui">
    <span class="panel-label">Цвет стёкол</span>
    <div class="swatch-row" id="swatchRow"></div>
    <div class="action-row">
      <button class="action-btn active" id="btnGlass">💎 Стёкла: вкл</button>
      <button class="action-btn" id="btnShowMarker2">🎯 Маркер</button>
    </div>
  </div>

  <!-- A-Frame Scene ───────────────────────────────────────────────────── -->
  <a-scene
    id="scene"
    embedded
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; zoom: 1;"
    renderer="logarithmicDepthBuffer: true; precision: medium; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!--
      Маркер: стандартный Hiro.
      Нажмите «Показать маркер» — откроется на экране, наведите сюда вторую камеру.
      Или распечатайте: https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png
    -->
    <a-marker preset="hiro" id="arMarker">

      <!--
        ТЕСТОВАЯ МОДЕЛЬ: процедурный кокошник из Three.js геометрий.
        Когда будет готов GLB-файл — замените атрибуты на:
          gltf-model="#kokoshnikModel"
          rotation="-90 0 0"
          scale="1 1 1"
        и добавьте <a-asset-item id="kokoshnikModel" src="kokoshnik.glb"> в <a-assets>.
      -->
      <a-entity
        id="kokoshnik"
        test-kokoshnik
        kokoshnik-glass
        position="0 0 0"
        rotation="0 0 0"
        scale="0.55 0.55 0.55">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ── Colour palette ───────────────────────────────────────────────────────
    const COLOURS = [
      { name: 'Красный',    hex: '#e53935', opacity: 0.55 },
      { name: 'Синий',      hex: '#1e88e5', opacity: 0.55 },
      { name: 'Зелёный',    hex: '#43a047', opacity: 0.55 },
      { name: 'Золотой',    hex: '#fdd835', opacity: 0.60 },
      { name: 'Фиолетовый', hex: '#8e24aa', opacity: 0.55 },
      { name: 'Розовый',    hex: '#e91e63', opacity: 0.55 },
      { name: 'Бирюзовый',  hex: '#00acc1', opacity: 0.55 },
      { name: 'Янтарный',   hex: '#ff8f00', opacity: 0.58 },
    ];

    // ── Component: procedural kokoshnik geometry ─────────────────────────────
    //
    // Builds a stylised kokoshnik from Three.js primitives.
    // Glass gems are named "glass_gem_N" so kokoshnik-glass finds them.
    // Emits 'model-loaded' so kokoshnik-glass can initialise.
    //
    AFRAME.registerComponent('test-kokoshnik', {
      init() {
        const group = new THREE.Group();

        const matGold = new THREE.MeshStandardMaterial({
          color: 0xd4af37, metalness: 0.85, roughness: 0.12,
        });
        const matRed = new THREE.MeshStandardMaterial({
          color: 0xb01030, metalness: 0.06, roughness: 0.58,
        });
        const matBand = new THREE.MeshStandardMaterial({
          color: 0x880020, metalness: 0.06, roughness: 0.62,
        });
        const matPearl = new THREE.MeshStandardMaterial({
          color: 0xf0ece0, metalness: 0.02, roughness: 0.28,
        });

        // ── Arch body (ExtrudeGeometry) ──────────────────────────────────
        // Profile in XY plane; Y = 0 is the marker surface.
        // Arch spans Y 0.30 → 1.90, X ±0.75.
        const shape = new THREE.Shape();
        shape.moveTo(-0.75, 0.30);
        shape.lineTo(-0.75, 0.65);
        shape.bezierCurveTo(-0.75, 1.20, -0.35, 1.75,  0,    1.90);
        shape.bezierCurveTo( 0.35, 1.75,  0.75, 1.20,  0.75, 0.65);
        shape.lineTo(0.75, 0.30);
        shape.closePath();

        const archGeo = new THREE.ExtrudeGeometry(shape, {
          depth: 0.08,
          bevelEnabled: true,
          bevelThickness: 0.022,
          bevelSize: 0.022,
          bevelSegments: 3,
        });
        const archMesh = new THREE.Mesh(archGeo, matRed);
        archMesh.name = 'arch_body';
        group.add(archMesh);

        // ── Headband box ─────────────────────────────────────────────────
        // Sits at the base of the arch, Y 0 → 0.42.
        const bandGeo = new THREE.BoxGeometry(1.56, 0.42, 0.10);
        const bandMesh = new THREE.Mesh(bandGeo, matBand);
        bandMesh.name = 'headband';
        bandMesh.position.set(0, 0.21, 0.04);
        group.add(bandMesh);

        // ── Gold trim: arch outline ──────────────────────────────────────
        // Sampled points following the arch edge (Z = 0.09 = front face + tiny offset).
        const borderPts = [
          [ 0.75, 0.28], [ 0.75, 0.50], [ 0.75, 0.65],
          [ 0.72, 0.90], [ 0.62, 1.15], [ 0.48, 1.40],
          [ 0.28, 1.65], [  0,   1.91],
          [-0.28, 1.65], [-0.48, 1.40], [-0.62, 1.15],
          [-0.72, 0.90], [-0.75, 0.65], [-0.75, 0.50], [-0.75, 0.28],
        ].map(([x, y]) => new THREE.Vector3(x, y, 0.105));

        const borderCurve = new THREE.CatmullRomCurve3(borderPts, false, 'catmullrom', 0.4);
        const trimGeo = new THREE.TubeGeometry(borderCurve, 100, 0.030, 8, false);
        const trimMesh = new THREE.Mesh(trimGeo, matGold);
        trimMesh.name = 'gold_trim_arch';
        group.add(trimMesh);

        // Gold horizontal bars on headband
        [
          [0, 0.415, 0.09, 1.56, 0.040, 0.055],
          [0, 0.005, 0.09, 1.56, 0.040, 0.055],
        ].forEach(([x, y, z, w, h, d], i) => {
          const barMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matGold);
          barMesh.name = `gold_bar_${i}`;
          barMesh.position.set(x, y, z);
          group.add(barMesh);
        });

        // Small gold circles pattern on arch body (decorative)
        const decPts = [
          [-0.55, 0.50], [-0.28, 0.50], [0, 0.50], [0.28, 0.50], [0.55, 0.50],
          [-0.42, 0.36], [-0.14, 0.36], [0.14, 0.36], [0.42, 0.36],
        ];
        decPts.forEach(([x, y], i) => {
          const dGeo = new THREE.TorusGeometry(0.04, 0.010, 6, 14);
          const dMesh = new THREE.Mesh(dGeo, matGold);
          dMesh.name = `dec_circle_${i}`;
          dMesh.position.set(x, y, 0.095);
          group.add(dMesh);
        });

        // ── Glass gems ───────────────────────────────────────────────────
        // Arranged in triangle rows inside the arch.
        // Name includes "glass" so kokoshnik-glass component finds them.
        const gemLayout = [
          //   x      y     r
          [  0,    1.70, 0.110 ],   // top single
          [ -0.30, 1.37, 0.090 ], [ 0.30, 1.37, 0.090 ],
          [ -0.50, 1.00, 0.085 ], [  0,   1.04, 0.090 ], [ 0.50, 1.00, 0.085 ],
          [ -0.60, 0.64, 0.080 ], [ -0.22,0.67, 0.080 ], [ 0.22, 0.67, 0.080 ], [ 0.60, 0.64, 0.080 ],
        ];

        const gemMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.68,
          roughness: 0.04,
          metalness: 0.0,
          side: THREE.FrontSide,
        });

        gemLayout.forEach(([x, y, r], i) => {
          const gemMesh = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 16), gemMat.clone());
          gemMesh.name = `glass_gem_${i}`;   // <── "glass" → found by kokoshnik-glass
          gemMesh.position.set(x, y, 0.115);
          group.add(gemMesh);

          // Gold setting ring around each gem
          const ringMesh = new THREE.Mesh(
            new THREE.TorusGeometry(r + 0.013, 0.013, 6, 20),
            matGold,
          );
          ringMesh.name = `gem_setting_${i}`;
          ringMesh.position.set(x, y, 0.095);
          group.add(ringMesh);
        });

        // ── Pearl fringe ─────────────────────────────────────────────────
        // Row of small pearls along the bottom gold bar.
        for (let p = -6; p <= 6; p++) {
          const pearlMesh = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 8), matPearl);
          pearlMesh.name = `pearl_${p + 6}`;
          pearlMesh.position.set(p * 0.112, -0.025, 0.06);
          group.add(pearlMesh);
        }

        // ── Mount and notify ─────────────────────────────────────────────
        this.el.setObject3D('mesh', group);

        // Emit model-loaded after a tick so kokoshnik-glass listener is ready.
        setTimeout(() => this.el.emit('model-loaded', {}, false), 0);

        document.getElementById('loadingBar').style.display = 'none';
      },
    });

    // ── Component: glass mesh colour manager ─────────────────────────────────
    //
    // Listens for 'model-loaded', finds meshes whose name contains "glass",
    // and exposes applyColour / clearColour / setGlassVisible to the UI.
    // Works with both test-kokoshnik (above) and real GLB models.
    //
    AFRAME.registerComponent('kokoshnik-glass', {
      init() {
        this.glassMeshes = [];
        this.glassMat    = null;
        this.glassOn     = true;

        this.el.addEventListener('model-loaded', () => this.onModelLoaded());
      },

      onModelLoaded() {
        const root = this.el.getObject3D('mesh');
        if (!root) return;

        const rx = /glass|стекло|crystal|gem|камен|bead|бусин/i;
        root.traverse(node => {
          if (node.isMesh && rx.test(node.name)) {
            node.userData.origMat = node.material.clone();
            this.glassMeshes.push(node);
          }
        });

        console.log('[kokoshnik-glass] meshes:', this.glassMeshes.map(m => m.name));

        window._glassComp = this;
        document.getElementById('loadingBar').style.display = 'none';
        document.dispatchEvent(new Event('glassReady'));
      },

      applyColour(hex, opacity) {
        if (!this.glassMat) {
          this.glassMat = new THREE.MeshStandardMaterial({
            transparent: true,
            roughness:   0.04,
            metalness:   0.06,
            side: THREE.FrontSide,
            depthWrite: false,
          });
        }
        this.glassMat.color.set(hex);
        this.glassMat.opacity = opacity;
        this.glassMat.needsUpdate = true;

        this.glassMeshes.forEach(m => {
          m.material = this.glassMat;
          m.visible  = this.glassOn;
        });
      },

      clearColour() {
        this.glassMeshes.forEach(m => {
          m.material = m.userData.origMat;
          m.visible  = this.glassOn;
        });
      },

      setGlassVisible(on) {
        this.glassOn = on;
        this.glassMeshes.forEach(m => { m.visible = on; });
      },
    });

    // ── Build colour swatches ────────────────────────────────────────────────
    const swatchRow = document.getElementById('swatchRow');

    const noneSwatch = document.createElement('button');
    noneSwatch.className = 'swatch swatch-none active';
    noneSwatch.title = 'Без цвета';
    noneSwatch.dataset.idx = '-1';
    swatchRow.appendChild(noneSwatch);

    COLOURS.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'swatch';
      btn.style.background = c.hex;
      btn.title = c.name;
      btn.dataset.idx = i;
      swatchRow.appendChild(btn);
    });

    let activeSwatchIdx = -1;

    function selectSwatch(idx) {
      activeSwatchIdx = idx;
      swatchRow.querySelectorAll('.swatch').forEach(s =>
        s.classList.toggle('active', +s.dataset.idx === idx)
      );

      const comp = window._glassComp;
      if (!comp) return;
      if (idx === -1) comp.clearColour();
      else { const c = COLOURS[idx]; comp.applyColour(c.hex, c.opacity); }
    }

    swatchRow.addEventListener('click', e => {
      const btn = e.target.closest('.swatch');
      if (btn) selectSwatch(+btn.dataset.idx);
    });

    // ── Glass toggle ─────────────────────────────────────────────────────────
    let glassOn = true;
    const btnGlass = document.getElementById('btnGlass');
    btnGlass.addEventListener('click', () => {
      glassOn = !glassOn;
      btnGlass.textContent = glassOn ? '💎 Стёкла: вкл' : '💎 Стёкла: выкл';
      btnGlass.classList.toggle('active', glassOn);
      window._glassComp?.setGlassVisible(glassOn);
    });

    // ── Marker overlay ───────────────────────────────────────────────────────
    function openMarkerOverlay()  { document.getElementById('markerOverlay').style.display = 'flex'; }
    function closeMarkerOverlay() { document.getElementById('markerOverlay').style.display = 'none'; }

    document.getElementById('showMarkerBtn').addEventListener('click',  openMarkerOverlay);
    document.getElementById('btnShowMarker2').addEventListener('click', openMarkerOverlay);
    document.getElementById('btnHideMarker').addEventListener('click',  closeMarkerOverlay);

    // ── AR marker found / lost ───────────────────────────────────────────────
    const arMarker     = document.getElementById('arMarker');
    const hint         = document.getElementById('hint');
    const ui           = document.getElementById('ui');
    const showMarkerBtn = document.getElementById('showMarkerBtn');

    let lastFound = false;

    function onMarkerFound() {
      if (lastFound) return;
      lastFound = true;
      hint.style.opacity = '0';
      showMarkerBtn.style.display = 'none';
      ui.style.display = 'flex';
      const flash = document.createElement('div');
      flash.className = 'flash-overlay';
      document.body.appendChild(flash);
      flash.addEventListener('animationend', () => flash.remove());
    }

    function onMarkerLost() {
      if (!lastFound) return;
      lastFound = false;
      hint.style.opacity = '1';
      showMarkerBtn.style.display = 'flex';
      ui.style.display = 'none';
    }

    arMarker.addEventListener('markerFound', onMarkerFound);
    arMarker.addEventListener('markerLost',  onMarkerLost);

    // Fallback: AR.js may bubble events to <a-scene> in some versions
    const sceneEl = document.getElementById('scene');
    sceneEl.addEventListener('markerFound', onMarkerFound);
    sceneEl.addEventListener('markerLost',  onMarkerLost);

    // ── Zoom ─────────────────────────────────────────────────────────────────
    const ZOOM_MIN = 0.5, ZOOM_MAX = 4.0, ZOOM_STEP = 0.25;
    let zoom = 1;

    function applyZoom() {
      document.querySelector('[camera]')?.setAttribute('zoom', zoom);
      document.getElementById('zoomLabel').textContent =
        zoom.toFixed(2).replace(/\.?0+$/, '') + '×';
    }

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      zoom = Math.min(ZOOM_MAX, +(zoom + ZOOM_STEP).toFixed(2)); applyZoom();
    });
    document.getElementById('btnZoomOut').addEventListener('click', () => {
      zoom = Math.max(ZOOM_MIN, +(zoom - ZOOM_STEP).toFixed(2)); applyZoom();
    });
  </script>

</body>
</html>
